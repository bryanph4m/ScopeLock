[project]
name = "scopelock"
version = "0.1.0"
description = "The mother speaks Spanish to an agent that speaks English to the institution."
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "guava-sdk",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "mcp>=2,<3",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
