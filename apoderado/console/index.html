<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apoderado — Live Console</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --border: #262b33;
    --text: #e8eaed;
    --dim: #7d8590;
    --green: #2ea043;
    --grey: #4b5158;
    --red: #f85149;
    --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app {
    display: grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: auto 1fr auto;
    gap: 14px;
    height: 100vh;
    padding: 14px;
  }
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: 0.5px; }
  header .case-line { color: var(--dim); font-size: 13px; margin-top: 2px; }
  #counter {
    text-align: right;
  }
  #counter .label {
    font-size: 12px; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase;
  }
  #counter .value {
    font-size: 64px; font-weight: 800; line-height: 1; color: var(--blue);
    font-variant-numeric: tabular-nums;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; overflow: hidden; display: flex; flex-direction: column;
  }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim);
    margin: 0 0 10px 0;
  }
  #transcript-panel { grid-row: 2; overflow: hidden; }
  #transcript {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    overflow-y: auto; flex: 1;
  }
  #transcript .col-header {
    font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px;
    position: sticky; top: 0; background: var(--panel); padding-bottom: 4px;
  }
  .bubble {
    border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 14px; line-height: 1.35;
    max-width: 100%;
  }
  .bubble.party { background: #1c2128; border: 1px solid var(--border); }
  .bubble.agent { background: #10243f; border: 1px solid #1f3a5f; }
  .bubble .who { font-size: 10px; color: var(--dim); text-transform: uppercase; margin-bottom: 3px; }

  #side { grid-row: 2; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }

  #mandate-board .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid transparent;
  }
  .chip.allowed { background: rgba(46,160,67,0.18); color: var(--green); border-color: rgba(46,160,67,0.4); }
  .chip.forbidden { background: rgba(75,81,88,0.25); color: var(--grey); border-color: var(--border); }
  .chip.blocked {
    background: rgba(248,81,73,0.22); color: var(--red); border-color: rgba(248,81,73,0.6);
    animation: flash 0.6s ease-in-out 2;
  }
  @keyframes flash { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.8); } }

  #card dl { margin: 0; font-size: 13px; }
  #card dt { color: var(--dim); font-size: 11px; text-transform: uppercase; margin-top: 8px; }
  #card dd { margin: 2px 0 0 0; }
  #card ul { margin: 2px 0 0 16px; padding: 0; }

  footer { grid-column: 1 / -1; color: var(--dim); font-size: 11px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Apoderado</h1>
      <div class="case-line" id="case-line">Waiting for a call…</div>
    </div>
    <div id="counter">
      <div class="label">Decisions made by the account holder</div>
      <div class="value"><span id="count">0</span> / <span id="count-total">0</span></div>
    </div>
  </header>

  <div class="panel" id="transcript-panel">
    <h2>Live Transcript</h2>
    <div id="transcript">
      <div class="col-header">Español · Household</div>
      <div class="col-header">English · Institution</div>
    </div>
  </div>

  <div id="side">
    <div class="panel" id="mandate-board">
      <h2>Mandate Board</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="panel" id="card">
      <h2>Callback Card</h2>
      <dl id="card-body">
        <dd style="color:var(--dim)">No card yet.</dd>
      </dl>
    </div>
  </div>

  <footer>polling /api/state every 400ms</footer>
</div>

<script>
const els = {
  caseLine: document.getElementById('case-line'),
  count: document.getElementById('count'),
  countTotal: document.getElementById('count-total'),
  transcript: document.getElementById('transcript'),
  chips: document.getElementById('chips'),
  cardBody: document.getElementById('card-body'),
};

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function renderCase(c) {
  if (!c) { els.caseLine.textContent = 'Waiting for a call…'; return; }
  els.caseLine.textContent =
    `${c.holder_name || '—'} · ${c.institution || '—'} · ${c.issue_type || '—'} · state: ${c.state}`;
}

function renderCounter(n) {
  els.count.textContent = n;
  els.countTotal.textContent = n;
}

function renderMandate(rules, violations) {
  const blockedVerbs = new Set(violations.map(v => v.verb));
  els.chips.innerHTML = '';
  for (const r of rules) {
    const chip = document.createElement('span');
    const blocked = blockedVerbs.has(r.verb);
    chip.className = 'chip ' + (blocked ? 'blocked' : (r.allowed ? 'allowed' : 'forbidden'));
    chip.textContent = r.verb.replace(/_/g, ' ');
    chip.title = r.verb_label || r.verb;
    els.chips.appendChild(chip);
  }
}

let lastTranscriptLen = 0;
function renderTranscript(rows) {
  if (rows.length === lastTranscriptLen) return;
  lastTranscriptLen = rows.length;
  const left = ['<div class="col-header">Español · Household</div>'];
  const right = ['<div class="col-header">English · Institution</div>'];
  for (const u of rows) {
    const html = `<div class="bubble ${u.speaker}"><div class="who">${esc(u.speaker)}</div>${esc(u.text)}</div>`;
    if (u.leg === 'household') left.push(html); else right.push(html);
  }
  els.transcript.innerHTML = left.join('') + right.join('');
  els.transcript.scrollTop = els.transcript.scrollHeight;
}

function renderCard(card) {
  if (!card) { els.cardBody.innerHTML = '<dd style="color:var(--dim)">No card yet.</dd>'; return; }
  const parts = [];
  if (card.asked && card.asked.length) parts.push(`<dt>Asked</dt><dd><ul>${card.asked.map(a => `<li>${esc(a)}</li>`).join('')}</ul></dd>`);
  if (card.told && card.told.length) parts.push(`<dt>Told</dt><dd><ul>${card.told.map(t => `<li>${esc(t)}</li>`).join('')}</ul></dd>`);
  if (card.reference_no) parts.push(`<dt>Reference #</dt><dd>${esc(card.reference_no)}</dd>`);
  if (card.agreed) parts.push(`<dt>Agreed</dt><dd>${esc(card.agreed)}</dd>`);
  if (card.refused && card.refused.length) parts.push(`<dt>Refused</dt><dd><ul>${card.refused.map(r => `<li>${esc(r)}</li>`).join('')}</ul></dd>`);
  if (card.next_step) parts.push(`<dt>Next step</dt><dd>${esc(card.next_step)}</dd>`);
  els.cardBody.innerHTML = parts.join('') || '<dd style="color:var(--dim)">No card yet.</dd>';
}

async function tick() {
  try {
    const res = await fetch('/api/state');
    const data = await res.json();
    renderCase(data.case);
    renderCounter(data.decision_count);
    renderMandate(data.mandate, data.violations);
    renderTranscript(data.transcript);
    renderCard(data.card);
  } catch (e) {
    // Swallow — the next tick will retry. Don't spam the console during a demo.
  }
}

tick();
setInterval(tick, 400);
</script>
</body>
</html>
