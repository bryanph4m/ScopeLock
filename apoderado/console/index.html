<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apoderado — Live Console</title>
<style>
  :root {
    --bg: #000000;
    --panel: #1c1c1e;
    --panel-2: #242426;
    --border: rgba(255,255,255,0.08);
    --text: #f2f2f7;
    --dim: rgba(235,235,245,0.6);
    --dim-2: rgba(235,235,245,0.35);
    --sent: #0a84ff;
    --sent-dark: #086bd1;
    --received: #303032;
    --green: #30d158;
    --grey: #8e8e93;
    --red: #ff453a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  #app {
    display: grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: auto 1fr auto;
    gap: 14px;
    height: 100vh;
    padding: 14px;
  }
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.2px; }
  header .case-line { color: var(--dim); font-size: 13px; margin-top: 3px; }
  #counter {
    text-align: right; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 8px 16px;
  }
  #counter .label {
    font-size: 10px; letter-spacing: 0.8px; color: var(--dim); text-transform: uppercase;
  }
  #counter .value {
    font-size: 34px; font-weight: 700; line-height: 1.1; color: var(--sent);
    font-variant-numeric: tabular-nums;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  #transcript-panel { grid-row: 2; overflow: hidden; padding: 0; }
  #transcript {
    display: grid; grid-template-columns: 1fr 1fr;
    overflow: hidden; flex: 1; min-height: 0;
  }
  .thread { display: flex; flex-direction: column; min-height: 0; }
  .thread + .thread { border-left: 1px solid var(--border); }
  .thread-header {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 10px 10px; border-bottom: 1px solid var(--border);
  }
  .thread-header .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
  }
  .thread-header.household .avatar { background: linear-gradient(#ff9f0a, #ff6a00); }
  .thread-header.institution .avatar { background: linear-gradient(#5e5ce6, #3634a3); }
  .thread-header .name { font-size: 13px; font-weight: 600; }
  .thread-header .sub { font-size: 11px; color: var(--dim); }
  .messages {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 12px 14px; display: flex; flex-direction: column;
  }
  .bubble-row { display: flex; flex-direction: column; margin-bottom: 2px; }
  .bubble-row.sent { align-items: flex-end; }
  .bubble-row.received { align-items: flex-start; }
  .bubble-row.group-start { margin-top: 10px; }
  .bubble {
    position: relative;
    border-radius: 18px; padding: 8px 13px; font-size: 14px; line-height: 1.32;
    max-width: 82%; word-wrap: break-word;
  }
  .bubble.sent { background: linear-gradient(180deg, var(--sent), var(--sent-dark)); color: #fff; }
  .bubble.received { background: var(--received); color: var(--text); }
  .bubble.tail.sent { border-bottom-right-radius: 4px; }
  .bubble.tail.received { border-bottom-left-radius: 4px; }
  .bubble.tail.sent::after {
    content: ""; position: absolute; bottom: 0; right: -6px; width: 14px; height: 16px;
    background: var(--sent-dark); border-bottom-left-radius: 12px 10px;
  }
  .bubble.tail.sent::before {
    content: ""; position: absolute; bottom: 0; right: -9px; width: 9px; height: 16px;
    background: var(--panel); border-bottom-left-radius: 8px;
  }
  .bubble.tail.received::after {
    content: ""; position: absolute; bottom: 0; left: -6px; width: 14px; height: 16px;
    background: var(--received); border-bottom-right-radius: 12px 10px;
  }
  .bubble.tail.received::before {
    content: ""; position: absolute; bottom: 0; left: -9px; width: 9px; height: 16px;
    background: var(--panel); border-bottom-right-radius: 8px;
  }
  .timestamp {
    font-size: 10px; color: var(--dim-2); text-align: center; margin: 12px 0 6px;
  }

  #side { grid-row: 2; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--dim);
    margin: 0; padding: 12px 14px 8px;
  }
  #mandate-board .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 14px; }
  .chip {
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid transparent;
  }
  .chip.allowed { background: rgba(48,209,88,0.16); color: var(--green); border-color: rgba(48,209,88,0.35); }
  .chip.forbidden { background: rgba(142,142,147,0.16); color: var(--grey); border-color: var(--border); }
  .chip.blocked {
    background: rgba(255,69,58,0.2); color: var(--red); border-color: rgba(255,69,58,0.55);
    animation: flash 0.6s ease-in-out 2;
  }
  @keyframes flash { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.8); } }

  #card { flex: 1; }
  #card-body { margin: 0; font-size: 13px; padding: 0 14px 14px; }
  #card dt { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; }
  #card dd { margin: 3px 0 0 0; }
  #card ul { margin: 2px 0 0 16px; padding: 0; }

  footer { grid-column: 1 / -1; color: var(--dim-2); font-size: 11px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Apoderado</h1>
      <div class="case-line" id="case-line">Waiting for a call…</div>
    </div>
    <div id="counter">
      <div class="label">Decisions by account holder</div>
      <div class="value"><span id="count">0</span> / <span id="count-total">0</span></div>
    </div>
  </header>

  <div class="panel" id="transcript-panel">
    <div id="transcript">
      <div class="thread" id="thread-household">
        <div class="thread-header household">
          <div class="avatar">H</div>
          <div class="name">Household</div>
          <div class="sub">Español</div>
        </div>
        <div class="messages" id="messages-household"></div>
      </div>
      <div class="thread" id="thread-institution">
        <div class="thread-header institution">
          <div class="avatar">I</div>
          <div class="name">Institution</div>
          <div class="sub">English</div>
        </div>
        <div class="messages" id="messages-institution"></div>
      </div>
    </div>
  </div>

  <div id="side">
    <div class="panel" id="mandate-board">
      <h2>Mandate Board</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="panel" id="card">
      <h2>Callback Card</h2>
      <dl id="card-body">
        <dd style="color:var(--dim)">No card yet.</dd>
      </dl>
    </div>
  </div>

  <footer>polling /api/state every 400ms</footer>
</div>

<script>
const els = {
  caseLine: document.getElementById('case-line'),
  count: document.getElementById('count'),
  countTotal: document.getElementById('count-total'),
  msgHousehold: document.getElementById('messages-household'),
  msgInstitution: document.getElementById('messages-institution'),
  chips: document.getElementById('chips'),
  cardBody: document.getElementById('card-body'),
};

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function renderCase(c) {
  if (!c) { els.caseLine.textContent = 'Waiting for a call…'; return; }
  els.caseLine.textContent =
    `${c.holder_name || '—'} · ${c.institution || '—'} · ${c.issue_type || '—'} · state: ${c.state}`;
}

function renderCounter(n) {
  els.count.textContent = n;
  els.countTotal.textContent = n;
}

function renderMandate(rules, violations) {
  const blockedVerbs = new Set(violations.map(v => v.verb));
  els.chips.innerHTML = '';
  for (const r of rules) {
    const chip = document.createElement('span');
    const blocked = blockedVerbs.has(r.verb);
    chip.className = 'chip ' + (blocked ? 'blocked' : (r.allowed ? 'allowed' : 'forbidden'));
    chip.textContent = r.verb.replace(/_/g, ' ');
    chip.title = r.verb_label || r.verb;
    els.chips.appendChild(chip);
  }
}

// speaker "agent" (Apoderado, acting for the account holder) renders as the
// sent/blue bubble on the right in both threads; "party" (whoever it's
// talking to on that leg) renders received/grey on the left.
function renderThread(container, rows) {
  const parts = [];
  let prevSpeaker = null;
  for (let i = 0; i < rows.length; i++) {
    const u = rows[i];
    const side = u.speaker === 'agent' ? 'sent' : 'received';
    const isGroupStart = u.speaker !== prevSpeaker;
    const isGroupEnd = i === rows.length - 1 || rows[i + 1].speaker !== u.speaker;
    const cls = ['bubble', side];
    if (isGroupEnd) cls.push('tail');
    parts.push(
      `<div class="bubble-row ${side}${isGroupStart ? ' group-start' : ''}">` +
        `<div class="${cls.join(' ')}">${esc(u.text)}</div>` +
        (isGroupEnd ? `<div class="timestamp" style="margin:2px 4px 0">${fmtTime(u.created_at)}</div>` : '') +
      `</div>`
    );
    prevSpeaker = u.speaker;
  }
  container.innerHTML = parts.join('');
  container.scrollTop = container.scrollHeight;
}

let lastTranscriptLen = 0;
function renderTranscript(rows) {
  if (rows.length === lastTranscriptLen) return;
  lastTranscriptLen = rows.length;
  renderThread(els.msgHousehold, rows.filter(u => u.leg === 'household'));
  renderThread(els.msgInstitution, rows.filter(u => u.leg === 'institution'));
}

function renderCard(card) {
  if (!card) { els.cardBody.innerHTML = '<dd style="color:var(--dim)">No card yet.</dd>'; return; }
  const parts = [];
  if (card.asked && card.asked.length) parts.push(`<dt>Asked</dt><dd><ul>${card.asked.map(a => `<li>${esc(a)}</li>`).join('')}</ul></dd>`);
  if (card.told && card.told.length) parts.push(`<dt>Told</dt><dd><ul>${card.told.map(t => `<li>${esc(t)}</li>`).join('')}</ul></dd>`);
  if (card.reference_no) parts.push(`<dt>Reference #</dt><dd>${esc(card.reference_no)}</dd>`);
  if (card.agreed) parts.push(`<dt>Agreed</dt><dd>${esc(card.agreed)}</dd>`);
  if (card.refused && card.refused.length) parts.push(`<dt>Refused</dt><dd><ul>${card.refused.map(r => `<li>${esc(r)}</li>`).join('')}</ul></dd>`);
  if (card.next_step) parts.push(`<dt>Next step</dt><dd>${esc(card.next_step)}</dd>`);
  els.cardBody.innerHTML = parts.join('') || '<dd style="color:var(--dim)">No card yet.</dd>';
}

async function tick() {
  try {
    const res = await fetch('/api/state');
    const data = await res.json();
    renderCase(data.case);
    renderCounter(data.decision_count);
    renderMandate(data.mandate, data.violations);
    renderTranscript(data.transcript);
    renderCard(data.card);
  } catch (e) {
    // Swallow — the next tick will retry. Don't spam the console during a demo.
  }
}

tick();
setInterval(tick, 400);
</script>
</body>
</html>
